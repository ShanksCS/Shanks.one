<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MileTrack Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0F172A;--surface:#1E293B;--surface2:#293548;
    --border:rgba(255,255,255,0.08);--green:#22C55E;--green-dim:rgba(34,197,94,0.12);
    --amber:#F59E0B;--red:#EF4444;--red-dim:rgba(239,68,68,0.12);
    --text:#F1F5F9;--muted:#94A3B8;
    --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
  }
  body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 0 60px}
  .screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;width:100%;padding:32px 24px}
  .screen.visible{display:flex}
  #adminScreen{display:none;flex-direction:column;align-items:center;width:100%}
  #adminScreen.visible{display:flex}
  .auth-logo{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:0.1em;color:var(--red);margin-bottom:6px}
  .auth-logo span{color:var(--muted);font-weight:400}
  .auth-subtitle{font-size:13px;color:var(--muted);margin-bottom:32px;text-align:center}
  .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px 24px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
  .auth-field{display:flex;flex-direction:column;gap:6px}
  .auth-field label{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)}
  .auth-input{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:15px;font-family:var(--sans);color:var(--text);outline:none;width:100%;transition:border-color 0.2s}
  .auth-input:focus{border-color:var(--red)}
  .auth-input::placeholder{color:var(--muted)}
  .auth-btn{background:var(--red);color:#fff;font-size:15px;font-weight:600;padding:14px;border-radius:12px;border:none;cursor:pointer;font-family:var(--sans);width:100%;transition:all 0.15s}
  .auth-btn:hover{background:#dc2626}
  .auth-btn:disabled{opacity:0.5;cursor:not-allowed}
  .auth-err{font-size:13px;color:var(--red);text-align:center;min-height:18px}
  header{width:100%;padding:20px 32px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);max-width:900px}
  .logo{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:0.08em;color:var(--red)}
  .logo span{color:var(--muted);font-weight:400}
  .admin-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--red-dim);color:var(--red);letter-spacing:0.06em;text-transform:uppercase}
  .header-right{display:flex;align-items:center;gap:12px}
  .btn-signout{background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px;padding:6px 14px;cursor:pointer;font-family:var(--sans);transition:all 0.15s}
  .btn-signout:hover{color:var(--red);border-color:var(--red)}
  main{width:100%;max-width:900px;padding:32px 32px 0;display:flex;flex-direction:column;gap:24px}
  .section{display:flex;flex-direction:column;gap:16px}
  .section-header{display:flex;align-items:center;justify-content:space-between}
  .section-title{font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
  .form-row{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted)}
  .input{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;font-family:var(--sans);color:var(--text);outline:none;width:100%;transition:border-color 0.2s}
  .input:focus{border-color:var(--green)}
  .input::placeholder{color:var(--muted)}
  .btn{font-family:var(--sans);font-size:14px;font-weight:600;padding:10px 20px;border-radius:10px;border:none;cursor:pointer;transition:all 0.15s;white-space:nowrap}
  .btn:active{transform:scale(0.97)}
  .btn:disabled{opacity:0.4;cursor:not-allowed}
  .btn-green{background:var(--green);color:#0a1a0f}
  .btn-green:hover{background:#16a34a}
  .btn-red{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:12px;padding:6px 12px}
  .btn-red:hover{color:var(--red);border-color:var(--red)}
  .btn-amber{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:12px;padding:6px 12px}
  .btn-amber:hover{color:var(--amber);border-color:var(--amber)}
  .form-err{font-size:13px;color:var(--red);min-height:18px}
  .form-ok{font-size:13px;color:var(--green);min-height:18px}
  table{width:100%;border-collapse:collapse}
  th{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border)}
  td{font-size:13px;padding:12px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:rgba(255,255,255,0.02)}
  .badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;letter-spacing:0.05em;text-transform:uppercase}
  .badge-admin{background:var(--red-dim);color:var(--red)}
  .badge-user{background:var(--green-dim);color:var(--green)}
  .badge-inactive{background:rgba(148,163,184,0.12);color:var(--muted)}
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px}
  .stat-val{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--amber)}
  .stat-label{font-size:11px;color:var(--muted);margin-top:4px;font-weight:500;letter-spacing:0.05em;text-transform:uppercase}
  .trips-filter{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;font-family:var(--sans);color:var(--text);outline:none}
  .select:focus{border-color:var(--green)}
  .empty{text-align:center;padding:32px;color:var(--muted);font-size:13px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:500;padding:10px 20px;border-radius:99px;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);z-index:100;white-space:nowrap}
  .toast.show{transform:translateX(-50%) translateY(0)}
  @media(max-width:600px){.form-row{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="screen visible" id="loginScreen">
  <div class="auth-logo">MILE<span>TRACK</span></div>
  <div class="auth-subtitle">Admin Panel — Authorised Access Only</div>
  <div class="auth-card">
    <div class="auth-field">
      <label>Email</label>
      <input class="auth-input" id="lEmail" type="email" placeholder="admin@example.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input class="auth-input" id="lPassword" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="auth-err" id="lErr"></div>
    <button class="auth-btn" id="lBtn" onclick="adminSignIn()">Sign In to Admin</button>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminScreen">
  <header>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="logo">MILE<span>TRACK</span></div>
      <div class="admin-badge">Admin</div>
    </div>
    <div class="header-right">
      <span id="adminEmail" style="font-size:12px;color:var(--muted)"></span>
      <button class="btn-signout" onclick="adminSignOut()">Sign Out</button>
    </div>
  </header>

  <main>
    <!-- Stats -->
    <div class="section">
      <div class="section-title">Overview</div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-val" id="statUsers">—</div>
          <div class="stat-label">Total Users</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="statTrips">—</div>
          <div class="stat-label">Total Trips</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="statMiles">—</div>
          <div class="stat-label">Total Miles</div>
        </div>
      </div>
    </div>

    <!-- Create User -->
    <div class="section">
      <div class="section-title">Create User</div>
      <div class="card">
        <div class="form-row">
          <div class="field">
            <label>Email</label>
            <input class="input" id="newEmail" type="email" placeholder="user@example.com">
          </div>
          <div class="field">
            <label>Password</label>
            <input class="input" id="newPassword" type="password" placeholder="Min. 8 characters">
          </div>
          <button class="btn btn-green" onclick="createUser()">Create</button>
        </div>
        <div class="form-err" id="createErr"></div>
        <div class="form-ok" id="createOk"></div>
      </div>
    </div>

    <!-- Users -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">Users</div>
        <button class="btn btn-green" style="font-size:12px;padding:6px 14px" onclick="loadUsers()">↻ Refresh</button>
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <div id="usersTable"><div class="empty">Loading…</div></div>
      </div>
    </div>

    <!-- All Trips -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">All Trips</div>
        <div class="trips-filter">
          <select class="select" id="filterUser" onchange="loadAllTrips()">
            <option value="">All users</option>
          </select>
          <button class="btn btn-green" style="font-size:12px;padding:6px 14px" onclick="exportAllCSV()">Export CSV</button>
        </div>
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <div id="tripsTable"><div class="empty">Loading…</div></div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://skxvayqmkmwzshwdggsi.supabase.co';
const SB_KEY = 'sb_publishable_Fx5G838ot2c-otAW3M4ofQ_2G6SMrpq';

const A_TOKEN   = 'mt_admin_token';
const A_REFRESH = 'mt_admin_refresh';
const A_USER    = 'mt_admin_user';

let aToken = sessionStorage.getItem(A_TOKEN);
let aUser  = JSON.parse(sessionStorage.getItem(A_USER)||'null');
let allUsers = [];
let allTrips = [];

// ── AUTH ──
async function sbAuthReq(path, body) {
  const res=await fetch(`${SB_URL}/auth/v1/${path}`,{
    method:'POST',
    headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  const d=await res.json();
  if(!res.ok)throw new Error(d.error_description||d.msg||'Auth error');
  return d;
}

async function aFetch(path, opts={}, retry=true) {
  if(!aToken)throw new Error('Not authenticated');
  const res=await fetch(`${SB_URL}/rest/v1/${path}`,{
    ...opts,
    headers:{
      'apikey':SB_KEY,
      'Authorization':`Bearer ${aToken}`,
      'Content-Type':'application/json',
      'Prefer':opts.prefer||'',
      ...opts.headers
    }
  });
  if(res.status===401&&retry){
    const r=sessionStorage.getItem(A_REFRESH);
    if(!r)throw new Error('Session expired');
    const d=await sbAuthReq('token?grant_type=refresh_token',{refresh_token:r});
    aToken=d.access_token;
    sessionStorage.setItem(A_TOKEN,d.access_token);
    return aFetch(path,opts,false);
  }
  if(!res.ok)throw new Error(await res.text());
  const t=await res.text();return t?JSON.parse(t):null;
}

async function adminSignIn() {
  const email=document.getElementById('lEmail').value.trim();
  const pw=document.getElementById('lPassword').value;
  const errEl=document.getElementById('lErr');
  const btn=document.getElementById('lBtn');
  errEl.textContent='';
  if(!email||!pw){errEl.textContent='Please enter your email and password';return;}

  // Rate limit
  const attempts=JSON.parse(sessionStorage.getItem('admin_attempts')||'[]')
    .filter(t=>Date.now()-t<15*60*1000);
  if(attempts.length>=5){errEl.textContent='Too many attempts. Please wait 15 minutes.';return;}

  btn.disabled=true; btn.textContent='Signing in…';
  try {
    const d=await sbAuthReq('token?grant_type=password',{email,password:pw});
    // Verify admin role
    const res=await fetch(`${SB_URL}/rest/v1/profiles?id=eq.${d.user.id}&select=role,active`,{
      headers:{'apikey':SB_KEY,'Authorization':`Bearer ${d.access_token}`}
    });
    const profiles=await res.json();
    if(!profiles||!profiles[0]||profiles[0].role!=='admin'){
      throw new Error('Access denied. Admin accounts only.');
    }
    if(!profiles[0].active){
      throw new Error('Your account has been deactivated.');
    }
    aToken=d.access_token; aUser=d.user;
    sessionStorage.setItem(A_TOKEN,d.access_token);
    sessionStorage.setItem(A_REFRESH,d.refresh_token);
    sessionStorage.setItem(A_USER,JSON.stringify(d.user));
    sessionStorage.setItem('admin_attempts','[]');
    enterAdmin();
  } catch(e) {
    attempts.push(Date.now());
    sessionStorage.setItem('admin_attempts',JSON.stringify(attempts));
    errEl.textContent=e.message==='Invalid login credentials'?'Incorrect email or password':e.message;
  } finally{btn.disabled=false;btn.textContent='Sign In to Admin';}
}

function adminSignOut(){
  sessionStorage.clear();
  aToken=null; aUser=null; allUsers=[]; allTrips=[];
  document.getElementById('adminScreen').classList.remove('visible');
  document.getElementById('loginScreen').classList.add('visible');
  document.getElementById('lPassword').value='';
  document.getElementById('lErr').textContent='';
}

function enterAdmin(){
  document.getElementById('loginScreen').classList.remove('visible');
  document.getElementById('adminScreen').classList.add('visible');
  if(aUser)document.getElementById('adminEmail').textContent=aUser.email||'';
  loadUsers(); loadAllTrips();
}

// ── USERS ──
async function loadUsers(){
  document.getElementById('usersTable').innerHTML='<div class="empty">Loading…</div>';
  try {
    const profiles=await aFetch('profiles?order=created_at.asc&select=id,email,role,active,created_at');
    allUsers=profiles||[];
    // Populate filter
    const filter=document.getElementById('filterUser');
    const current=filter.value;
    filter.innerHTML='<option value="">All users</option>';
    allUsers.filter(u=>u.role!=='admin').forEach(u=>{
      const o=document.createElement('option');
      o.value=u.id; o.textContent=u.email;
      filter.appendChild(o);
    });
    filter.value=current;
    updateStats();
    renderUsers();
  } catch(e){
    document.getElementById('usersTable').innerHTML=`<div class="empty" style="color:var(--red)">${e.message}</div>`;
  }
}

function renderUsers(){
  if(!allUsers.length){document.getElementById('usersTable').innerHTML='<div class="empty">No users found</div>';return;}
  const rows=allUsers.map(u=>`
    <tr>
      <td>${u.email}</td>
      <td><span class="badge badge-${u.role==='admin'?'admin':'user'}">${u.role}</span></td>
      <td><span class="badge ${u.active?'badge-user':'badge-inactive'}">${u.active?'Active':'Inactive'}</span></td>
      <td>${new Date(u.created_at).toLocaleDateString('en-GB')}</td>
      <td style="display:flex;gap:6px">
        ${u.role!=='admin'?`
          <button class="btn btn-amber" onclick="resetPassword('${u.id}','${u.email}')">Reset PW</button>
          <button class="btn btn-red" onclick="toggleUser('${u.id}',${u.active})">${u.active?'Deactivate':'Activate'}</button>
        `:'<span style="color:var(--muted);font-size:12px">—</span>'}
      </td>
    </tr>
  `).join('');
  document.getElementById('usersTable').innerHTML=`
    <table>
      <thead><tr><th>Email</th><th>Role</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function createUser(){
  const email=document.getElementById('newEmail').value.trim();
  const pw=document.getElementById('newPassword').value;
  const errEl=document.getElementById('createErr');
  const okEl=document.getElementById('createOk');
  errEl.textContent=''; okEl.textContent='';
  if(!email||!pw){errEl.textContent='Please enter email and password';return;}
  if(pw.length<8){errEl.textContent='Password must be at least 8 characters';return;}
  try {
    // Use Supabase Admin API via service key — we use the publishable key here
    // so we create via auth signup then immediately set active
    const res=await fetch(`${SB_URL}/auth/v1/admin/users`,{
      method:'POST',
      headers:{
        'apikey':SB_KEY,
        'Authorization':`Bearer ${aToken}`,
        'Content-Type':'application/json'
      },
      body:JSON.stringify({email,password:pw,email_confirm:true})
    });
    const d=await res.json();
    if(!res.ok){
      // Fallback: try signup endpoint
      const d2=await sbAuthReq('signup',{email,password:pw});
      okEl.textContent=`✓ Account created for ${email}`;
      document.getElementById('newEmail').value='';
      document.getElementById('newPassword').value='';
      await loadUsers();
      return;
    }
    okEl.textContent=`✓ Account created for ${email}`;
    document.getElementById('newEmail').value='';
    document.getElementById('newPassword').value='';
    await loadUsers();
  } catch(e){errEl.textContent=e.message;}
}

async function toggleUser(id, currentlyActive){
  const action=currentlyActive?'deactivate':'activate';
  if(!confirm(`Are you sure you want to ${action} this user?`))return;
  try {
    await aFetch(`profiles?id=eq.${id}`,{
      method:'PATCH',
      prefer:'return=minimal',
      body:JSON.stringify({active:!currentlyActive})
    });
    showToast(`User ${action}d`);
    await loadUsers();
  } catch(e){showToast('Error: '+e.message);}
}

async function resetPassword(id, email){
  if(!confirm(`Send password reset email to ${email}?`))return;
  try {
    await fetch(`${SB_URL}/auth/v1/recover`,{
      method:'POST',
      headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email})
    });
    showToast(`Reset email sent to ${email}`);
  } catch(e){showToast('Error: '+e.message);}
}

// ── TRIPS ──
async function loadAllTrips(){
  document.getElementById('tripsTable').innerHTML='<div class="empty">Loading…</div>';
  try {
    const userId=document.getElementById('filterUser').value;
    const path=userId
      ?`trips?user_id=eq.${userId}&order=id.desc&limit=200`
      :`trips?order=id.desc&limit=200`;
    const rows=await aFetch(path+'&select=id,date,start_address,end_address,miles,rate,purpose,user_id');
    allTrips=rows||[];
    updateStats();
    renderTrips();
  } catch(e){
    document.getElementById('tripsTable').innerHTML=`<div class="empty" style="color:var(--red)">${e.message}</div>`;
  }
}

function renderTrips(){
  if(!allTrips.length){document.getElementById('tripsTable').innerHTML='<div class="empty">No trips found</div>';return;}
  const userMap={};
  allUsers.forEach(u=>userMap[u.id]=u.email);
  const rows=allTrips.map(t=>{
    const pay=(t.miles*(t.rate||0.25)).toFixed(2);
    return `<tr>
      <td>${t.date}</td>
      <td style="font-size:12px;color:var(--muted)">${userMap[t.user_id]||'Unknown'}</td>
      <td style="font-size:12px">${t.start_address}<br><span style="color:var(--muted)">→ ${t.end_address}</span></td>
      <td style="color:var(--amber);font-family:var(--mono);font-weight:700">${parseFloat(t.miles).toFixed(1)}</td>
      <td style="color:var(--green);font-family:var(--mono)">£${pay}</td>
      <td style="font-size:12px;color:var(--muted)">${t.purpose||'—'}</td>
    </tr>`;
  }).join('');
  document.getElementById('tripsTable').innerHTML=`
    <table>
      <thead><tr><th>Date</th><th>User</th><th>Route</th><th>Miles</th><th>£</th><th>Purpose</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function updateStats(){
  const activeUsers=allUsers.filter(u=>u.role!=='admin'&&u.active).length;
  document.getElementById('statUsers').textContent=activeUsers;
  document.getElementById('statTrips').textContent=allTrips.length;
  const totalMiles=allTrips.reduce((s,t)=>s+parseFloat(t.miles||0),0);
  document.getElementById('statMiles').textContent=totalMiles.toFixed(1);
}

function exportAllCSV(){
  if(!allTrips.length){showToast('No trips to export');return;}
  const userMap={};
  allUsers.forEach(u=>userMap[u.id]=u.email);
  const header='Date,User,Start Location,End Location,Purpose,Miles,Rate,£';
  const rows=allTrips.map(t=>{
    const rate=t.rate||0.25,pay=(parseFloat(t.miles)*rate).toFixed(2);
    return `"${t.date}","${userMap[t.user_id]||''}","${t.start_address}","${t.end_address}","${t.purpose||''}",${parseFloat(t.miles).toFixed(1)},${rate.toFixed(2)},${pay}`;
  });
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent([header,...rows].join('\n'));
  a.download=`miletrack_admin_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); showToast('CSV exported');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

// Auto-restore admin session (session storage only — clears on tab close)
if(aToken&&aUser) enterAdmin();

document.getElementById('lPassword').addEventListener('keydown',e=>{if(e.key==='Enter')adminSignIn();});
</script>
</body>
</html>
